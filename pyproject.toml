[project]
name = "graduation-project-database"
version = "0.1.0"
description = "GoAlgo FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.27",
    "fastapi>=0.123.10",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "scikit-learn",
    "pandas",
    "python-dotenv",
]

[project.optional-dependencies]
ml = [
    "ultralytics",
    "torch",
    "opencv-python-headless",
    "easyocr",
    "matplotlib",
]
